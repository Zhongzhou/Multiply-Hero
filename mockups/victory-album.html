<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Victory Album — mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1e2a3a;
        --cream: #fffdf8;
        --gold: #8a5a08;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: Fredoka, 'Trebuchet MS', 'Segoe UI', sans-serif;
        background:
          radial-gradient(circle at 8% 10%, #fff3b0 0 68px, transparent 70px),
          radial-gradient(circle at 88% 12%, #fff 0 34px, transparent 36px),
          radial-gradient(circle at 78% 18%, #fff 0 18px, transparent 20px),
          linear-gradient(#b7e4ff 0%, #fff6df 54%, #b7e4a4 100%);
      }

      button {
        font: inherit;
        color: inherit;
        touch-action: manipulation;
      }

      button:focus-visible {
        outline: 4px solid #2f6fed;
        outline-offset: 3px;
      }

      .screen {
        width: min(820px, 100%);
        margin: 0 auto;
        padding: max(0.85rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1.4rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      }

      .preview-pill {
        display: inline-block;
        margin: 0 0 0.45rem;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        padding: 0.05rem 0.7rem;
        font-size: 0.85rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.05;
      }

      .lede,
      .fine {
        margin: 0.4rem 0 0;
        font-size: 1.05rem;
      }

      .album {
        position: relative;
        margin-top: 1.1rem;
      }

      .underpage {
        position: absolute;
        inset: 0;
        border: 3px solid var(--ink);
        border-radius: 1.5rem;
        background: #fff1cc;
      }

      .underpage.one {
        transform: translate(6px, 6px);
      }

      .underpage.two {
        transform: translate(11px, 11px);
        background: #ffe3a3;
      }

      .page {
        position: relative;
        z-index: 1;
        border: 3px solid var(--ink);
        border-radius: 1.5rem;
        background: color-mix(in srgb, var(--cream) 94%, transparent);
        box-shadow: 6px 6px 0 var(--ink);
        padding: 0.9rem;
      }

      .page.turn-older {
        animation: turn-older 280ms ease-out;
      }

      .page.turn-newer {
        animation: turn-newer 280ms ease-out;
      }

      @keyframes turn-older {
        from {
          opacity: 0.2;
          transform: translateX(-22px) rotate(-0.4deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes turn-newer {
        from {
          opacity: 0.2;
          transform: translateX(22px) rotate(0.4deg);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .day-nav {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.7rem;
        align-items: center;
      }

      .nav-btn {
        min-width: 4.25rem;
        min-height: 4.25rem;
        border: 3px solid var(--ink);
        border-radius: 1.15rem;
        background: var(--cream);
        box-shadow: 4px 4px 0 var(--ink);
        font-size: 1.8rem;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
      }

      .nav-btn:active:not(:disabled) {
        transform: translate(2px, 2px);
        box-shadow: none;
      }

      .nav-btn:disabled {
        background: #d5cfc3;
        color: #625c54;
        box-shadow: none;
        cursor: not-allowed;
      }

      .day-label {
        text-align: center;
      }

      .day-title {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        font-weight: 700;
        line-height: 1.05;
      }

      .day-date,
      .page-hint,
      .level-copy p {
        margin: 0.2rem 0 0;
        font-size: 1.05rem;
      }

      .score {
        margin: 0.85rem 0 0;
        text-align: center;
        font-weight: 700;
        font-size: 1.15rem;
      }

      .score-num {
        display: block;
        font-size: clamp(2.4rem, 6vw, 3.2rem);
        line-height: 0.95;
      }

      .levels {
        display: grid;
        gap: 0.75rem;
        margin-top: 0.9rem;
      }

      .level {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          'copy boss'
          'tray tray';
        gap: 0.35rem 0.75rem;
        align-items: center;
        border: 3px solid var(--ink);
        border-radius: 1.15rem;
        box-shadow: 4px 4px 0 var(--ink);
        padding: 0.55rem 0.7rem 0.65rem;
      }

      .level-easy {
        background: #e7f8d8;
      }

      .level-medium {
        background: #fff1c2;
      }

      .level-hard {
        background: #ffe0d2;
      }

      .boss {
        grid-area: boss;
        width: 6.4rem;
        height: 5.6rem;
        justify-self: end;
      }

      .boss img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
      }

      .level-medium .boss img,
      .level-hard .boss img {
        mix-blend-mode: multiply;
      }

      .level-copy {
        grid-area: copy;
      }

      .level-copy h2 {
        margin: 0;
        font-size: 1.45rem;
      }

      .win-count {
        font-weight: 700;
      }

      .tray {
        grid-area: tray;
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem 0.45rem;
        align-items: flex-end;
        min-height: 4.3rem;
        margin: 0;
        padding: 0.15rem 0 0;
      }

      .medal,
      .empty-medal {
        width: 3.15rem;
        height: auto;
        filter: drop-shadow(2px 2px 0 var(--gold));
      }

      .medal {
        animation: medal-pop 340ms ease-out both;
      }

      .empty-medal {
        filter: none;
        opacity: 0.55;
      }

      @keyframes medal-pop {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.6);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .fine {
        margin-top: 1.35rem;
        max-width: 38rem;
      }

      @media (min-width: 700px) {
        .level {
          grid-template-columns: minmax(8.5rem, 0.55fr) 1fr auto;
          grid-template-areas: 'copy tray boss';
          min-height: 6.4rem;
        }

        .tray {
          justify-content: flex-start;
          align-items: center;
          min-height: 0;
          padding-top: 0;
        }
      }

      @media (max-width: 420px) {
        .nav-btn {
          min-width: 3.4rem;
          min-height: 3.4rem;
        }

        .boss {
          width: 5.2rem;
          height: 4.6rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .page.turn-older,
        .page.turn-newer,
        .medal {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <p class="preview-pill">Mockup</p>
      <h1>Victory Album</h1>
      <p class="lede">Each day is a page. Every win is a gold medal.</p>

      <div class="album" id="album">
        <div class="underpage two" id="under-two" aria-hidden="true"></div>
        <div class="underpage one" id="under-one" aria-hidden="true"></div>
        <article class="page" id="page" aria-live="polite">
          <div class="day-nav">
            <button type="button" class="nav-btn" id="older" aria-label="Older day">←</button>
            <div class="day-label">
              <h2 class="day-title" id="day-title">Today</h2>
              <p class="day-date" id="day-date"></p>
            </div>
            <button type="button" class="nav-btn" id="newer" aria-label="Newer day">→</button>
          </div>
          <p class="score" id="score"></p>
          <div class="levels" id="levels"></div>
          <p class="page-hint" id="page-hint"></p>
        </article>
      </div>

      <p class="fine">
        Sample pages, so the arrows can be tried. Later, a finished win on Easy, Medium, or Hard
        would add one gold medal to that day’s page on this tablet. The newer arrow stops on today.
      </p>
    </main>

    <script>
      const levels = [
        {
          id: 'easy',
          name: 'Easy',
          boss: 'Hammy the pig',
          src: '../public/animals/Pig004.png',
        },
        {
          id: 'medium',
          name: 'Medium',
          boss: 'Lance the cow',
          src: '../public/animals/Bull004.png',
        },
        {
          id: 'hard',
          name: 'Hard',
          boss: 'Raja the tiger',
          src: '../public/animals/Tiger004.png',
        },
      ]

      /** Days ago → wins. Index 0 is today. */
      const sample = [
        { easy: 3, medium: 2, hard: 1 },
        { easy: 1, medium: 0, hard: 2 },
        { easy: 4, medium: 1, hard: 0 },
        { easy: 0, medium: 0, hard: 0 },
        { easy: 2, medium: 3, hard: 1 },
        { easy: 0, medium: 1, hard: 0 },
        { easy: 5, medium: 2, hard: 2 },
        { easy: 2, medium: 0, hard: 0 },
      ]

      const page = document.getElementById('page')
      const olderBtn = document.getElementById('older')
      const newerBtn = document.getElementById('newer')
      const titleEl = document.getElementById('day-title')
      const dateEl = document.getElementById('day-date')
      const scoreEl = document.getElementById('score')
      const levelsEl = document.getElementById('levels')
      const hintEl = document.getElementById('page-hint')
      const underOne = document.getElementById('under-one')
      const underTwo = document.getElementById('under-two')

      let index = 0
      let pointerStart = null

      function dayFromToday(daysAgo) {
        const date = new Date()
        date.setHours(12, 0, 0, 0)
        date.setDate(date.getDate() - daysAgo)
        return date
      }

      function medalSvg(id, delay) {
        return `<svg class="medal" style="animation-delay:${delay}ms" viewBox="0 0 64 80" aria-hidden="true">
          <defs>
            <radialGradient id="${id}" cx="32%" cy="28%" r="75%">
              <stop offset="0%" stop-color="#fff7c4"/>
              <stop offset="42%" stop-color="#ffd34d"/>
              <stop offset="100%" stop-color="#e0940c"/>
            </radialGradient>
          </defs>
          <path d="M18 3h12l3 20H16z" fill="#f08a8a"/>
          <path d="M34 3h12l-2 20H30z" fill="#d64545"/>
          <path d="M22 3h20l-2 7H24z" fill="#ffe1e1"/>
          <circle cx="32" cy="50" r="22" fill="#c9840a" stroke="#8a5a08" stroke-width="3"/>
          <circle cx="32" cy="50" r="18" fill="url(#${id})" stroke="#fff1a8" stroke-width="2.5"/>
          <ellipse cx="25" cy="43" rx="6" ry="3.5" fill="#fff8d0" opacity="0.9"/>
          <polygon fill="#8a5a08" points="32,36 35.2,44.2 44,44.8 37.2,50.4 39.4,59 32,54.2 24.6,59 26.8,50.4 20,44.8 28.8,44.2"/>
        </svg>`
      }

      const emptyMedal = `<svg class="empty-medal" viewBox="0 0 64 80" aria-hidden="true">
        <circle cx="32" cy="50" r="18" fill="none" stroke="#1e2a3a" stroke-width="2.5" stroke-dasharray="5 5"/>
      </svg>`

      function render(direction) {
        const daysAgo = index
        const date = dayFromToday(daysAgo)
        const wins = sample[daysAgo]
        const total = levels.reduce((sum, level) => sum + wins[level.id], 0)
        const behind = sample.length - 1 - index

        titleEl.textContent =
          daysAgo === 0 ? 'Today' : daysAgo === 1 ? 'Yesterday' : date.toLocaleDateString(undefined, { weekday: 'long' })
        dateEl.textContent = date.toLocaleDateString(undefined, { month: 'long', day: 'numeric' })
        scoreEl.innerHTML =
          total === 0
            ? 'No gold medals this day'
            : `<span class="score-num">${total}</span> gold medal${total === 1 ? '' : 's'}`

        levelsEl.innerHTML = levels
          .map((level) => {
            const count = wins[level.id]
            const medals =
              count === 0
                ? emptyMedal
                : Array.from({ length: count }, (_, i) => medalSvg(`${level.id}-${daysAgo}-${i}`, i * 45)).join('')
            const winLabel = count === 0 ? 'No wins' : `${count} win${count === 1 ? '' : 's'}`
            const medalLabel = count === 0 ? 'No gold medals' : `${count} gold medal${count === 1 ? '' : 's'}`
            return `<section class="level level-${level.id}" data-testid="level-${level.id}">
              <div class="boss" aria-hidden="true">
                <img src="${level.src}" alt="" />
              </div>
              <div class="level-copy">
                <h2>${level.name}</h2>
                <p>${level.boss}</p>
                <p class="win-count" data-testid="wins-${level.id}">${winLabel}</p>
              </div>
              <div class="tray" role="img" aria-label="${medalLabel}">${medals}</div>
            </section>`
          })
          .join('')

        olderBtn.disabled = index >= sample.length - 1
        newerBtn.disabled = index === 0
        underOne.hidden = behind < 1
        underTwo.hidden = behind < 2
        hintEl.textContent =
          index === 0
            ? 'Turn back for older days.'
            : index === sample.length - 1
              ? 'This is the oldest sample page.'
              : `${behind} older ${behind === 1 ? 'page' : 'pages'} left.`

        if (direction) {
          page.classList.remove('turn-older', 'turn-newer')
          void page.offsetWidth
          page.classList.add(direction === 'older' ? 'turn-older' : 'turn-newer')
        }
      }

      function go(delta) {
        const next = index + delta
        if (next < 0 || next >= sample.length) return
        index = next
        render(delta > 0 ? 'older' : 'newer')
      }

      olderBtn.addEventListener('click', () => go(1))
      newerBtn.addEventListener('click', () => go(-1))

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') go(1)
        if (event.key === 'ArrowRight') go(-1)
      })

      page.addEventListener('pointerdown', (event) => {
        if (event.target.closest('button')) {
          pointerStart = null
          return
        }
        pointerStart = event.clientX
      })

      page.addEventListener('pointerup', (event) => {
        if (pointerStart == null) return
        const delta = event.clientX - pointerStart
        pointerStart = null
        if (delta > 48) go(1)
        else if (delta < -48) go(-1)
      })

      render(null)
    </script>
  </body>
</html>
